###############################################################################
# SAMPLE OBJECT CONFIGURATION FOR NAGIOS CORE PURE-RUBY ENGINE
###############################################################################

# -----------------------------------------------------------------------------
# HOST DEFINITIONS
# -----------------------------------------------------------------------------

define host {
    host_name               localhost
    alias                   Nagios Ruby Engine Server
    address                 web
    max_check_attempts      3
    check_interval          10
    retry_interval          2
    check_command           /app/libexec/check_tcp.rb -H web -p 3000
    notifications_enabled   1
}

define host {
    host_name               gateway
    alias                   Internal Gateway Router
    address                 web
    parents                 localhost
    max_check_attempts      2
    check_interval          15
    retry_interval          3
    check_command           /app/libexec/check_tcp.rb -H web -p 3000
    notifications_enabled   1
}

# -----------------------------------------------------------------------------
# SERVICE DEFINITIONS
# -----------------------------------------------------------------------------

define service {
    host_name               localhost
    service_description     HTTP Endpoint Health
    check_command           /app/libexec/check_http.rb -u http://web:3000/healthz
    check_interval          10
    retry_interval          2
    max_check_attempts      3
    notifications_enabled   1
}

define service {
    host_name               localhost
    service_description     Root Disk Usage
    check_command           /app/libexec/check_disk.rb -p / -w 80 -c 90
    check_interval          15
    retry_interval          5
    max_check_attempts      3
    notifications_enabled   1
}

define service {
    host_name               localhost
    service_description     System Memory
    check_command           /app/libexec/check_memory.rb -w 85 -c 95
    check_interval          15
    retry_interval          3
    max_check_attempts      3
    notifications_enabled   1
}

define service {
    host_name               gateway
    service_description     TCP Port 3000
    check_command           /app/libexec/check_tcp.rb -H web -p 3000
    check_interval          12
    retry_interval          3
    max_check_attempts      2
    notifications_enabled   1
}
