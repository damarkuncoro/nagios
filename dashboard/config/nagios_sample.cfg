###############################################################################
# SAMPLE OBJECT CONFIGURATION FOR NAGIOS CORE PURE-RUBY ENGINE
###############################################################################

# -----------------------------------------------------------------------------
# COMMAND DEFINITIONS (Pure-Ruby Plugins)
# -----------------------------------------------------------------------------

define command {
    command_name            check_tcp
    command_line            $USER1$/check_tcp.rb -H $HOSTADDRESS$ -p $ARG1$
}

define command {
    command_name            check_http
    command_line            $USER1$/check_http.rb -u http://$HOSTADDRESS$:$ARG1$$ARG2$
}

define command {
    command_name            check_disk
    command_line            $USER1$/check_disk.rb -p $ARG1$ -w $ARG2$ -c $ARG3$
}

define command {
    command_name            check_memory
    command_line            $USER1$/check_memory.rb -w $ARG1$ -c $ARG2$
}

define command {
    command_name            check_load
    command_line            $USER1$/check_load.rb -w $ARG1$ -c $ARG2$
}

define command {
    command_name            check_process
    command_line            $USER1$/check_process.rb -C $ARG1$ -w $ARG2$ -c $ARG3$
}

define command {
    command_name            check_dns
    command_line            $USER1$/check_dns.rb -H $ARG1$
}

# -----------------------------------------------------------------------------
# HOST DEFINITIONS
# -----------------------------------------------------------------------------

define host {
    host_name               localhost
    alias                   Nagios Ruby Engine Server
    address                 web
    max_check_attempts      3
    check_interval          10
    retry_interval          2
    check_command           check_tcp!3000
    notifications_enabled   1
}

define host {
    host_name               gateway
    alias                   Internal Gateway Router
    address                 web
    parents                 localhost
    max_check_attempts      2
    check_interval          15
    retry_interval          3
    check_command           check_tcp!3000
    notifications_enabled   1
}

# -----------------------------------------------------------------------------
# SERVICE DEFINITIONS
# -----------------------------------------------------------------------------

define service {
    host_name               localhost
    service_description     HTTP Endpoint Health
    check_command           check_http!3000!/healthz
    check_interval          10
    retry_interval          2
    max_check_attempts      3
    notifications_enabled   1
}

define service {
    host_name               localhost
    service_description     Root Disk Usage
    check_command           check_disk!/!80!90
