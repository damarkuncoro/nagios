    max_check_attempts      3
    notifications_enabled   1
}

define service {
    host_name               gateway
    service_description     TCP Port 3000
    check_command           check_tcp!3000
    check_interval          12
    retry_interval          3
    max_check_attempts      2
    notifications_enabled   1
}

define service {
    host_name               gateway
    service_description     DNS Resolution
    check_command           check_dns!localhost
    check_interval          20
    retry_interval          5
    max_check_attempts      2
    notifications_enabled   1
}
