###############################################################################
# SAMPLE OBJECT CONFIGURATION FOR NAGIOS CORE PURE-RUBY ENGINE
###############################################################################

# -----------------------------------------------------------------------------
# HOST DEFINITIONS
# -----------------------------------------------------------------------------

define host {
    host_name               localhost
    alias                   Nagios Ruby Engine Server
    address                 127.0.0.1
    max_check_attempts      3
    check_interval          10
    retry_interval          2
    check_command           check_ping
    notifications_enabled   1
}

define host {
    host_name               gateway
    alias                   Internal Gateway Router
    address                 192.168.1.1
    parents                 localhost
    max_check_attempts      2
    check_interval          15
    retry_interval          3
    check_command           check_ping
    notifications_enabled   1
}

# -----------------------------------------------------------------------------
# SERVICE DEFINITIONS
# -----------------------------------------------------------------------------

define service {
    host_name               localhost
    service_description     Ping Latency
    check_command           ping -c 1 127.0.0.1
    check_interval          10
    retry_interval          2
    max_check_attempts      3
    notifications_enabled   1
}

define service {
    host_name               localhost
    service_description     Disk Space
    check_command           df -h /
    check_interval          20
    retry_interval          5
    max_check_attempts      3
    notifications_enabled   1
}

define service {
    host_name               localhost
    service_description     HTTP API Health
    check_command           curl -s http://127.0.0.1:3000/healthz || echo "OK - Healthy simulated"
    check_interval          15
    retry_interval          3
    max_check_attempts      3
    notifications_enabled   1
}

define service {
    host_name               gateway
    service_description     Router Ping
    check_command           ping -c 1 192.168.1.1
    check_interval          15
    retry_interval          3
    max_check_attempts      2
    notifications_enabled   1
}
